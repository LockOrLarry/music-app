AWSTemplateFormatVersion: '2010-09-09'
Description: A music search application using a prebuilt Docker AMI and AWS Cognito for authentication.

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair
    Type: AWS::EC2::KeyPair::KeyName
    Default: n11399589

Resources:
  MusicServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: ami-0e25e0874539dd125
      IamInstanceProfile: CAB432-Instance-Role
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: subnet-04ca053dcbe5f49cc
          AssociatePublicIpAddress: true
          GroupSet:
            - sg-032bd1ff8cf77dbb9
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -xe
          aws ecr get-login-password --region ap-southeast-2 \
            | docker login --username AWS --password-stdin 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com
          docker pull 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n11399589-assignment1-repo:server
          docker run -d -p 5000:5000 --name music-server 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n11399589-assignment1-repo:server

  MyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: n1234567-prac
      Schema:
        - Name: email
          Required: true
          Mutable: true

  MyUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: n1234567-prac-client
      UserPoolId: !Ref MyUserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref MusicServerInstance
  PublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt MusicServerInstance.PublicIp
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref MyUserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref MyUserPoolClient
  UserPoolClientSecret:
    Description: Cognito App Client Secret
    Value: !GetAtt MyUserPoolClient.ClientSecret