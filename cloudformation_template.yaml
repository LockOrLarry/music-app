AWSTemplateFormatVersion: '2010-09-09'
Description: A music search application using a prebuilt Docker AMI.

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair
    Type: AWS::EC2::KeyPair::KeyName
    Default: n11399589

Resources:
  MusicServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: ami-0e25e0874539dd125
      IamInstanceProfile: CAB432-Instance-Role
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: subnet-04ca053dcbe5f49cc
          AssociatePublicIpAddress: true
          GroupSet:
            - sg-032bd1ff8cf77dbb9
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -xe

          # Only update and install what's needed (no docker)
          apt-get update -y
          apt-get install -y nginx openssl

          # Start Docker (if not already running)
          systemctl enable docker
          systemctl start docker

          # Pull and run app
          aws ecr get-login-password --region ap-southeast-2 \
            | docker login --username AWS --password-stdin 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com
          docker pull 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n11399589-assignment1-repo:server
          docker rm -f music-server || true
          docker run -d --restart unless-stopped -p 5000:5000 --name music-server 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n11399589-assignment1-repo:server

          # Create self-signed cert
          mkdir -p /etc/ssl/selfsigned
          openssl req -x509 -nodes -days 365 \
            -subj "/CN=jamapp.cab432.com" \
            -newkey rsa:2048 \
            -keyout /etc/ssl/selfsigned/selfsigned.key \
            -out /etc/ssl/selfsigned/selfsigned.crt

          # Write Nginx config using echo
          echo 'server {
              listen 443 ssl;
              server_name jamapp.cab432.com;

              ssl_certificate /etc/ssl/selfsigned/selfsigned.crt;
              ssl_certificate_key /etc/ssl/selfsigned/selfsigned.key;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }' > /etc/nginx/sites-available/jamapp

          # Enable site and restart Nginx
          ln -sf /etc/nginx/sites-available/jamapp /etc/nginx/sites-enabled/jamapp
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl enable nginx
          systemctl restart nginx

  SessionStoreTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: jamapp-sessions
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true
      Tags:
        - Key: Purpose
          Value: SessionStore

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref MusicServerInstance

  PublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt MusicServerInstance.PublicIp


