AWSTemplateFormatVersion: '2010-09-09'
Description: A music search application using a prebuilt Docker AMI.

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair
    Type: AWS::EC2::KeyPair::KeyName
    Default: n11399589

Resources:
  MusicServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: ami-0e25e0874539dd125
      IamInstanceProfile: CAB432-Instance-Role
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: subnet-05a3b8177138c8b14
          AssociatePublicIpAddress: true
          GroupSet:
            - sg-032bd1ff8cf77dbb9
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -xe

          # Update packages and install dependencies
          apt-get update -y
          apt-get install -y nginx openssl git docker-compose-plugin

          # Start Docker (if not already running)
          systemctl enable docker
          systemctl start docker

          # Prepare application directory
          cd /opt
          rm -rf music-app || true
          git clone https://github.com/LockOrLarry/music-app.git
          cd music-app

          # Seed environment files from templates and populate dynamic values
          cp server/.env.template server/.env
          cp worker/.env.template worker/.env

          QUEUE_URL=$(aws ssm get-parameter --name "/jamapp/DownloadJobsQueueUrl" --query 'Parameter.Value' --output text --region ap-southeast-2)
          TABLE_NAME=$(aws ssm get-parameter --name "/jamapp/DownloadJobsTableName" --query 'Parameter.Value' --output text --region ap-southeast-2)
          RESULTS_BUCKET=$(aws ssm get-parameter --name "/jamapp/DownloadResultsBucket" --query 'Parameter.Value' --output text --region ap-southeast-2)

          sed -i "s|^DOWNLOAD_JOBS_QUEUE_URL=.*|DOWNLOAD_JOBS_QUEUE_URL=$QUEUE_URL|" server/.env
          sed -i "s|^DOWNLOAD_JOBS_TABLE_NAME=.*|DOWNLOAD_JOBS_TABLE_NAME=$TABLE_NAME|" server/.env
          sed -i "s|^DOWNLOAD_RESULTS_BUCKET=.*|DOWNLOAD_RESULTS_BUCKET=$RESULTS_BUCKET|" server/.env

          sed -i "s|^DOWNLOAD_JOBS_QUEUE_URL=.*|DOWNLOAD_JOBS_QUEUE_URL=$QUEUE_URL|" worker/.env
          sed -i "s|^DOWNLOAD_JOBS_TABLE_NAME=.*|DOWNLOAD_JOBS_TABLE_NAME=$TABLE_NAME|" worker/.env
          sed -i "s|^DOWNLOAD_RESULTS_BUCKET=.*|DOWNLOAD_RESULTS_BUCKET=$RESULTS_BUCKET|" worker/.env

          # Authenticate with ECR
          aws ecr get-login-password --region ap-southeast-2 \
            | docker login --username AWS --password-stdin 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com

          # Deploy services via Docker Compose
          docker compose pull
          docker compose up -d
  
  FavouritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: jamapp-favourites
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: track_id
          AttributeType: N
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: track_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: JamApp
        - Key: Environment
          Value: Production
  
  FavouritesTableNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jamapp/FavouritesTableName
      Type: String
      Value: !Ref FavouritesTable

  JamendoClientIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jamapp/JamendoClientID
      Type: String
      Value: 8d0c92e6

  DownloadJobsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: jamapp-download-jobs-dlq
      MessageRetentionPeriod: 1209600

  DownloadJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: jamapp-download-jobs
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DownloadJobsDLQ.Arn
        maxReceiveCount: 5

  DownloadJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: jamapp-download-jobs
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: JamApp
        - Key: Environment
          Value: Production

  DownloadResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub jamapp-download-results-${AWS::AccountId}
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldDownloads
            Status: Enabled
            ExpirationInDays: 7

  DownloadJobsQueueParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jamapp/DownloadJobsQueueUrl
      Type: String
      Value: !Ref DownloadJobsQueue

  DownloadJobsTableParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jamapp/DownloadJobsTableName
      Type: String
      Value: !Ref DownloadJobsTable

  DownloadResultsBucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /jamapp/DownloadResultsBucket
      Type: String
      Value: !Ref DownloadResultsBucket

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref MusicServerInstance
  PublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt MusicServerInstance.PublicIp
  FavouritesTableName:
    Value: !Ref FavouritesTable
    Export:
      Name: JamApp-FavouritesTableName
  DownloadJobsQueueUrl:
    Value: !Ref DownloadJobsQueue
    Export:
      Name: JamApp-DownloadJobsQueueUrl
  DownloadJobsTableName:
    Value: !Ref DownloadJobsTable
    Export:
      Name: JamApp-DownloadJobsTableName
  DownloadResultsBucketName:
    Value: !Ref DownloadResultsBucket
    Export:
      Name: JamApp-DownloadResultsBucket
