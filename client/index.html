<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jamapp</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
  h1 { text-align: center; }
  #searchContainer { display: flex; justify-content: center; margin-bottom: 20px; }
  #searchInput { width: 300px; padding: 8px; font-size: 16px; }
  #searchBtn { padding: 8px 16px; margin-left: 8px; font-size: 16px; cursor: pointer; }
  #oidcLoginBtn {background-color: whitesmoke; color: black;}
  #favBtn {background-color: #28a745; color: #fff;}
  #backBtn{background-color:#dc3545 ; color: #fff;}
  #results { max-width: 800px; margin: 0 auto; }
  .track { display: flex; align-items: center; margin-bottom: 12px; background: white; padding: 8px; border-radius: 6px; }
  .track span { flex: 1; font-weight: bold; }
  .track button { padding: 6px 12px; margin-left: 4px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
  .original { background-color: #28a745; }
  .transcode { background-color: #007bff; }
  #loginContainer { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; }
  .authBtn { padding: 8px 16px; font-size: 16px; border-radius: 6px; border: none; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; }
  .authBtn.logout { background: #dc3545; }
  .authBtn.favourites { background: #ffc107; color: #333; }
  .authBtn.download { background: #28a745; }
</style>
</head>
<body>

<div id="loginContainer"></div>

<h1>Jamapp</h1>
<div id="searchContainer">
  <input type="text" id="searchInput" placeholder="Enter search term..." />
  <button id="searchBtn">Search</button>
</div>

<div id="results"></div>

<script>
const FORMATS = ["mp3", "ogg", "wav", "flac"];
let isAuthenticated = false;
let userInfo = {};
let favouritedIds = [];

async function getAuthState() {
  try {
    const res = await fetch("/userinfo", { credentials: "include" });
    if (!res.ok) throw new Error("Not authenticated");
    const data = await res.json();
    isAuthenticated = data.isAuthenticated;
    userInfo = data.userInfo || {};
    setAuthUI(isAuthenticated, userInfo);
    if (isAuthenticated) {
      try {
        await fetchFavourites();
      } catch (err) {
        console.error("Failed to load favourites:", err);
      }
    } else {
      favouritedIds = [];
    }
  } catch {
    isAuthenticated = false;
    userInfo = {};
    setAuthUI(false, {});
    favouritedIds = [];
  }
}

function setAuthUI(auth, info) {
  const container = document.getElementById("loginContainer");
  container.innerHTML = "";
  if (auth) {
    container.innerHTML = `
      <span style="font-weight:bold; color:#333; background:#e9ecef; padding:8px 16px; border-radius:6px;">
        ${info.name || info.email || "User"}
      </span>
      <button id="logoutBtn" class="authBtn logout">Log Out</button>
      <button id="favouritesBtn" class="authBtn favourites">Favourites</button>
      <button id="downloadAllFlacBtn" class="authBtn download">Download Favourites (FLAC)</button>
    `;
    document.getElementById("logoutBtn").onclick = () => {
        window.location.href = "/logout";
    };
    document.getElementById("favouritesBtn").onclick = showFavouritesPage;
    document.getElementById("downloadAllFlacBtn").onclick = downloadAllFlac;
  } else {
    container.innerHTML = `<button id="oidcLoginBtn" class="authBtn">Login with OIDC</button>`;
    document.getElementById("oidcLoginBtn").onclick = () => { window.location="/login"; };
  }
}

async function fetchFavourites() {
  try {
    const res = await fetch("/myfavourites", { credentials: "include" });
    if (!res.ok) {
      throw new Error(res.statusText || "Failed to fetch favourites");
    }
    const data = await res.json();
    const results = data.results || [];
    favouritedIds = results.map(track => String(track.id));
    return results;
  } catch (err) {
    favouritedIds = [];
    throw err;
  }
}

async function searchTracks() {
  const query = document.getElementById("searchInput").value.trim();
  if (!query) return;
  try {
    const res = await fetch(`/search?q=${encodeURIComponent(query)}`, { credentials: "include" });
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    renderTracks(data.results || []);
  } catch (err) {
    document.getElementById("results").textContent = "Search failed: " + err.message;
  }
}

function renderTracks(tracks) {
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (!tracks || tracks.length === 0) {
    resultsDiv.innerHTML = "<p>No tracks found</p>";
    return;
  }

  tracks.forEach(track => {
    if (!track.id || !track.name || !track.artist_name) return;
    if (track.audiodownload_allowed === false) return;

    const trackDiv = document.createElement("div");
    trackDiv.classList.add("track");

    const title = document.createElement("span");
    title.textContent = `${track.name} - ${track.artist_name} `;
    trackDiv.appendChild(title);

    FORMATS.forEach(format => {
      const btn = document.createElement("button");
      btn.textContent = `${format.toUpperCase()}`;
      btn.className = (format === "mp3" ? "original" : "transcode");
      btn.onclick = () => window.location = `/download/${track.id}?format=${format}`;
      trackDiv.appendChild(btn);
    });

    if (isAuthenticated) {
      const trackId = String(track.id);
      const favBtn = document.createElement("button");
      favBtn.id = "favBtn";
      favBtn.textContent = favouritedIds.includes(trackId) ? "Unfavourite" : "Favourite";
      favBtn.className = "authBtn";
      favBtn.onclick = async () => {
        const isFav = favouritedIds.includes(trackId);
        const endpoint = isFav ? "/unfavourite" : "/favourite";
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ trackId: track.id }),
          credentials: "include"
        });

        if (res.ok) {
          if (isFav) {
            favouritedIds = favouritedIds.filter(id => id !== trackId);
            favBtn.textContent = "Favourite";
            if (window.location.pathname === "/myfavourites") {
              trackDiv.remove();
            }
          } else {
            favouritedIds.push(trackId);
            favBtn.textContent = "Unfavourite";
          }
        } else {
          console.error("Favourite toggle failed", await res.json());
        }
      };
      trackDiv.appendChild(favBtn);
    }

    resultsDiv.appendChild(trackDiv);
  });
}

async function showFavouritesPage() {
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    // Back button
    const backBtn = document.createElement("button");
    backBtn.id = "backBtn"
    backBtn.textContent = "Back to Search";
    backBtn.className = "authBtn";
    backBtn.onclick = showSearchPage;

    history.pushState({}, "", "/myfavourites");
    document.getElementById("searchContainer").style.display = "none";
    document.querySelector("h1").textContent = "Favourites";

    try {
        const favourites = await fetchFavourites();
        renderTracks(favourites);
    } catch (err) {
        resultsDiv.innerHTML = `<p>Error fetching favourites: ${err.message}</p>`;
        console.error("Error fetching favourites:", err);
    }
    resultsDiv.appendChild(backBtn);
}

function showSearchPage() {
  history.pushState({}, "", "/");
  document.getElementById("searchContainer").style.display = "flex";
  document.querySelector("h1").textContent = "Jamapp";
  document.getElementById("results").innerHTML = "";
  // Clear any existing search results and reset the page
  searchTracks(); // Re-run the last search or show empty state
}

function downloadAllFlac() {
  fetch("/myfavourites", { credentials: "include" })
    .then(res => res.json())
    .then(data => {
      const tracks = data.results || [];
      tracks.forEach(track => {
        const a = document.createElement("a");
        a.href = `/download/${track.id}?format=flac`;
        a.download = `${track.name || track.id}.flac`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    });
}

window.addEventListener("popstate", () => { location.pathname === "/myfavourites" ? showFavouritesPage() : showSearchPage(); });
document.getElementById("searchBtn").addEventListener("click", searchTracks);
document.getElementById("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") searchTracks(); });
document.addEventListener("DOMContentLoaded", function() {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("loggedin")) {
    window.history.replaceState({}, "", "/");
    setTimeout(getAuthState, 100); // slight delay to ensure session cookie is set
  } else {
    getAuthState();
  }
});
</script>
</body>
</html>
